name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libffi-dev libssl-dev python3-dev pip unzip openjdk-17-jdk liblqr-1-0-dev
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel "cython<3.0.0"
          pip install --upgrade buildozer

      - name: Prepare NDK 25b & Setup Environment
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cd ~/.buildozer/android/platform/
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip
          
          # تثبيت الوصلات الرمزية الشاملة لجميع الاحتمالات
          ln -sf android-ndk-r25b android-ndk-r28c
          ln -sf android-ndk-r25b android-ndk-r20c
          ln -sf android-ndk-r25b android-ndk
          
          # ضبط ملف buildozer.spec مباشرة
          cd $GITHUB_WORKSPACE
          sed -i 's/^#* *android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#* *android.api =.*/android.api = 31/' buildozer.spec
          sed -i 's/^#* *android.minapi =.*/android.minapi = 21/' buildozer.spec

      - name: Build Android APK
        run: |
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          
          # تشغيل البناء مع حفظ اللوج وطباعة آخر 100 سطر عند أي خطأ
          yes | buildozer android debug > build.log 2>&1 || (echo "=== BUILD FAILED ===" && tail -n 100 build.log && exit 1)
          
          mkdir -p bin
          find . -name "*.apk" -exec cp {} bin/ \;
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makeen-bank-apk
          path: bin/*.apk
