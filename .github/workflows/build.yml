name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libffi-dev libssl-dev python3-dev pip unzip openjdk-17-jdk liblqr-1-0-dev
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel "cython<3.0.0"
          pip install --upgrade buildozer

      - name: Prepare NDK 25b and Configure Spec
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cd ~/.buildozer/android/platform/
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip
          
          # العودة لمجلد المشروع وتعديل buildozer.spec قسراً لمنع استخدام r28c
          cd /home/runner/work/makeen-bank-app/makeen-bank-app
          sed -i 's/^#* *android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#* *android.api =.*/android.api = 31/' buildozer.spec
          sed -i 's/^#* *android.minapi =.*/android.minapi = 21/' buildozer.spec
          echo "android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r25b" >> buildozer.spec

      - name: Build Android APK
        run: |
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          echo "y" | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makeen-bank-apk
          path: bin/*.apk
