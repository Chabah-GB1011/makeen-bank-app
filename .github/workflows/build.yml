name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Dependencies & Compatible P4A
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libffi-dev libssl-dev python3-dev pip unzip openjdk-17-jdk liblqr-1-0-dev
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel "cython<3.0.0"
          pip install --upgrade buildozer
          pip install --upgrade "python-for-android>=2024.1.0"

      - name: Prepare NDK 25 & Environment
        run: |
          rm -rf .buildozer
          
          mkdir -p ~/.buildozer/android/platform/
          cd ~/.buildozer/android/platform/
          rm -rf android-ndk-r25b*
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          mv android-ndk-r25b android-ndk-r25
          rm android-ndk-r25b-linux.zip
          
          ln -sf android-ndk-r25 android-ndk-r28c
          ln -sf android-ndk-r25 android-ndk-r20c
          ln -sf android-ndk-r25 android-ndk

      - name: Build Android APK
        run: |
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25"
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r25"
          
          # إزالة وضع الـ debug والاعتماد على وضع البناء العادي لتخفيف السجلات وعدم إيقاف الشاشة
          buildozer android debug
          
          mkdir -p bin
          find . -name "*.apk" -exec cp {} bin/ \;
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makeen-bank-apk
          path: bin/*.apk
